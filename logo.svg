<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Code bracket icon -->
  <g transform="translate(5, 10)">
    <!-- Left bracket -->
    <path d="M12 5 L5 15 L12 25" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right bracket -->
    <path d="M28 5 L35 15 L28 25" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Slash -->
    <line x1="22" y1="3" x2="18" y2="27" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text TechDZ -->
  <text x="52" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#blueGrad)" letter-spacing="-0.5">Tech</text>
  <text x="128" y="38" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#greenGrad)" letter-spacing="-0.5">DZ</text>
  
  <!-- Algeria flag accent -->
  <rect x="195" y="22" width="3" height="16" rx="1.5" fill="#006233"/>
  <circle cx="210" cy="30" r="6" fill="none" stroke="#006233" stroke-width="1.5"/>
  <circle cx="213" cy="30" r="5" fill="#006233"/>
  <path d="M216 30 L210 26.5 L210 33.5 Z" fill="#D4A853"/>
</svg>