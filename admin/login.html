<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — TechDZ</title>
    <link rel="icon" type="image/svg+xml" href="../logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../logo.svg" alt="TechDZ" height="32">
                <h1>Administration</h1>
                <p>Connectez-vous pour gérer la plateforme</p>
            </div>
            <div class="alert error" id="alertError"></div>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="admin@techdz.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
            </form>
            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> Retour au site</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="../auth.js"></script>
    <script>
        Auth.init();

        const form = document.getElementById('loginForm');
        const alertError = document.getElementById('alertError');
        const loginBtn = document.getElementById('loginBtn');

        // Check if already logged in as admin
        Auth.getUser().then(async ({ user }) => {
            if (user) {
                const isAdmin = await Auth.isAdmin(user.id);
                if (isAdmin) window.location.href = 'index.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
            loginBtn.disabled = true;
            alertError.style.display = 'none';

            const { data, error } = await Auth.signIn(email, password);

            if (error) {
                alertError.textContent = error.message.includes('Invalid login') ? 'Email ou mot de passe incorrect' : error.message;
                alertError.style.display = 'block';
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                loginBtn.disabled = false;
                return;
            }

            const isAdmin = await Auth.isAdmin(data.user.id);
            if (!isAdmin) {
                alertError.textContent = "Vous n'avez pas les droits d'administration";
                alertError.style.display = 'block';
                await Auth.signOut();
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                loginBtn.disabled = false;
                return;
            }

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
