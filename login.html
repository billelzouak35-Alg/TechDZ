<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — TechDZ</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .auth-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            filter: blur(60px);
        }
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo img { height: 36px; }
        .auth-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 12px;
        }
        .auth-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-group input {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .form-group .error-text {
            color: var(--red);
            font-size: 0.8rem;
            display: none;
        }
        .form-group.error input { border-color: var(--red); }
        .form-group.error .error-text { display: block; }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 4px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin: 0 auto;
            padding: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .btn-google:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: scale(1.05);
        }
        .btn-google img { width: 20px; height: 20px; }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-top: -8px;
        }
        .forgot-link:hover { text-decoration: underline; }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            display: none;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--red);
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--secondary);
        }
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Retour
    </a>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="logo.svg" alt="TechDZ">
                <h1>Bienvenue</h1>
                <p>Connectez-vous à votre compte</p>
            </div>

            <div class="alert error" id="alertError"></div>
            <div class="alert success" id="alertSuccess"></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group" id="emailGroup">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com" required>
                    <span class="error-text"></span>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                    <span class="error-text"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
                <a href="reset-password.html" class="forgot-link">Mot de passe oublié ?</a>
            </form>

            <div class="divider">ou</div>

            <button class="btn-google" id="googleBtn" aria-label="Se connecter avec Google" title="Se connecter avec Google">
                <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            </button>

            <div class="auth-footer">
                Pas encore de compte ? <a href="register.html">Créer un compte</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="auth.js"></script>
    <script>
        Auth.init();

        // Check if already logged in
        Auth.getUser().then(({ user }) => {
            if (user) window.location.href = 'index.html';
        });

        const form = document.getElementById('loginForm');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const loginBtn = document.getElementById('loginBtn');

        function showError(msg) {
            alertError.textContent = msg;
            alertError.style.display = 'block';
            alertSuccess.style.display = 'none';
        }

        function showSuccess(msg) {
            alertSuccess.textContent = msg;
            alertSuccess.style.display = 'block';
            alertError.style.display = 'none';
        }

        // Email non confirmé : message + bouton pour renvoyer le lien de confirmation
        function showUnconfirmed(email) {
            alertError.innerHTML =
                'Votre email n\'est pas encore confirmé. Vérifiez votre boîte mail.' +
                '<button type="button" class="btn btn-outline" id="resendBtn" style="margin-top:12px;width:100%;">Renvoyer l\'email de confirmation</button>';
            alertError.style.display = 'block';
            alertSuccess.style.display = 'none';

            document.getElementById('resendBtn').addEventListener('click', async () => {
                const btn = document.getElementById('resendBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';
                const { error } = await Auth.resendConfirmation(email);
                if (error) {
                    alertError.textContent = 'Impossible de renvoyer l\'email : ' + (error.message || 'erreur inconnue');
                    alertError.style.display = 'block';
                } else {
                    alertError.textContent = 'Email de confirmation renvoyé. Vérifiez votre boîte mail (pensez aux spams).';
                    alertError.style.display = 'block';
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
            loginBtn.disabled = true;

            const { data, error } = await Auth.signIn(email, password);
            console.log('Sign in result:', { data, error });

            if (error) {
                const msg = error.message || JSON.stringify(error) || 'Erreur inconnue';
                if (msg.includes('Email not confirmed') || error.code === 'email_not_confirmed') {
                    showUnconfirmed(email);
                } else if (msg.includes('Invalid login') || msg.includes('invalid')) {
                    showError('Email ou mot de passe incorrect');
                } else if (msg.includes('not initialized')) {
                    showError('Erreur de configuration — contactez l\'administrateur');
                } else {
                    showError(msg);
                }
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                loginBtn.disabled = false;
            } else if (data.user && !Auth.isEmailConfirmed(data.user)) {
                // Session créée malgré tout → la détruire et bloquer l'accès
                await Auth.signOut(null);
                showUnconfirmed(email);
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                loginBtn.disabled = false;
            } else {
                showSuccess('Connexion réussie ! Redirection...');
                localStorage.setItem('techdz-user', JSON.stringify(data.user));
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            const { error } = await Auth.signInWithGoogle();
            if (error) showError(error.message);
        });
    </script>
</body>
</html>
