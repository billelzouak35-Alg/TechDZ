<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.reset">Réinitialiser le mot de passe — TechDZ</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .auth-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            filter: blur(60px);
        }
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo img { height: 36px; }
        .auth-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 12px;
        }
        .auth-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-group input {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            display: none;
            line-height: 1.6;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--red);
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--secondary);
        }
        .alert.success .check-icon {
            display: block;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--secondary);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <a href="login.html" class="back-link">
        <i class="fas fa-arrow-left"></i> <span data-i18n="common.back">Retour</span>
    </a>

    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-card">
            <div class="auth-logo">
                <img src="logo.svg" alt="TechDZ">
                <h1 data-i18n="reset.title">Mot de passe oublié ?</h1>
                <p data-i18n="reset.subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>
            </div>

            <div class="alert error" id="alertError"></div>
            <div class="alert success" id="alertSuccess"></div>

            <form class="auth-form" id="resetForm">
                <div class="form-group" id="emailGroup">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com" required autocomplete="email">
                    <span class="error-text"></span>
                </div>
                <div id="hcaptcha-widget"></div>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="resetBtn">
                    <i class="fas fa-paper-plane"></i> <span data-i18n="reset.send">Envoyer le lien</span>
                </button>
            </form>

            <div class="auth-footer">
                <span data-i18n="reset.remember">Vous vous souvenez de votre mot de passe ?</span> <a href="login.html" data-i18n="register.login">Se connecter</a>
            </div>
        </div>
    </div>

    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || localStorage.getItem('techdz-lang') || 'fr';
            localStorage.setItem('techdz-lang', lang);
            const tr = window.translations;
            const data = (tr && tr[lang]) || (tr && tr.fr) || {};
            if (lang === 'ar') document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', lang);
            const apply = (attr, set) => document.querySelectorAll('[' + attr + ']').forEach(el => {
                const k = el.getAttribute(attr);
                if (data[k]) set(el, data[k]);
            });
            apply('data-i18n', (el, v) => el.textContent = v);
            apply('data-i18n-placeholder', (el, v) => el.placeholder = v);
            apply('data-i18n-title', (el, v) => el.title = v);
            apply('data-i18n-aria', (el, v) => el.setAttribute('aria-label', v));
            window.t = function (key, fb) {
                const v = data[key];
                return (v !== undefined && v !== null && v !== '') ? v : (fb !== undefined ? fb : key);
            };
        })();
    </script>
    <script src="auth.js"></script>
    <script>
        Auth.init();

        const form = document.getElementById('resetForm');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const resetBtn = document.getElementById('resetBtn');

        function showError(msg) {
            alertError.textContent = msg;
            alertError.style.display = 'block';
            alertSuccess.style.display = 'none';
        }

        function showSuccess(msg) {
            alertSuccess.innerHTML = '<i class="fas fa-check-circle check-icon"></i>' + msg;
            alertSuccess.style.display = 'block';
            alertError.style.display = 'none';
        }

        // ==========================================
        // hCaptcha — protection anti-bots
        // ==========================================
        let captchaToken = null;
        window.hcaptchaCallback = (token) => { captchaToken = token; };
        window.hcaptchaExpiredCallback = () => { captchaToken = null; };

        // Le captcha n'est exigé que si une vraie Site Key est configurée
        function hcaptchaEnabled() {
            return !!window.HCAPTCHA_SITE_KEY && !window.HCAPTCHA_SITE_KEY.startsWith('VOTRE_');
        }

        // Attendre le chargement de l'API hCaptcha (script async/defer)
        function waitForHcaptcha(timeoutMs) {
            return new Promise((resolve) => {
                const start = Date.now();
                const check = () => {
                    if (window.hcaptcha) return resolve(true);
                    if (Date.now() - start > timeoutMs) return resolve(false);
                    setTimeout(check, 100);
                };
                check();
            });
        }

        async function initHcaptcha() {
            if (!hcaptchaEnabled()) return;
            const loaded = await waitForHcaptcha(5000);
            if (!loaded) {
                showError('Impossible de charger le captcha de sécurité. Rechargez la page ou réessayez plus tard.');
                return;
            }
            try {
                hcaptcha.render('hcaptcha-widget', {
                    sitekey: window.HCAPTCHA_SITE_KEY,
                    callback: 'hcaptchaCallback',
                    'expired-callback': 'hcaptchaExpiredCallback'
                });
            } catch (e) {
                console.error('Erreur de rendu hCaptcha :', e);
                showError('Impossible de charger le captcha de sécurité. Rechargez la page ou réessayez plus tard.');
            }
        }

        initHcaptcha();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return;

            // hCaptcha requis mais absent → bloquer la soumission
            if (hcaptchaEnabled() && !captchaToken) {
                showError('Veuillez compléter le captcha');
                return;
            }

            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('login.sending');
            resetBtn.disabled = true;

            const { error } = await Auth.requestPasswordReset(email, captchaToken);
            console.log('Password reset request:', { email, error });

            if (error) {
                const msg = error.message || t('common.unknown');
                if (msg.includes('rate limit') || msg.includes('rate_limit')) {
                    showError(t('reset.tooMany'));
                } else {
                    showError(msg);
                }
                // Token consommé ou invalide → régénérer le captcha
                captchaToken = null;
                Auth.resetCaptcha();
                resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ' + t('reset.send');
                resetBtn.disabled = false;
            } else {
                captchaToken = null;
                Auth.resetCaptcha();
                showSuccess(t('reset.sent'));
                form.style.display = 'none';
            }
        });
    </script>
</body>
</html>
